openapi: 3.1.0
info:
  title: Sentinel AI API
  description: |
    HTTP contract for Sentinel AI ingest and control plane.

    Trace payloads MUST conform to `packages/schema/jsonschema/v1`.

    **Implementation status:** Ingest, projects, runs, health, quarantine,
    derived metrics, evaluation, and benchmarking routes are implemented by
    `apps/server` (Phases 3–8).
  version: 0.1.0
  contact:
    name: Sentinel AI Maintainers
  license:
    name: License TBD
    url: https://github.com/itsAttaullah/sentinel-ai

servers:
  - url: http://localhost:8080
    description: Local self-hosted (future Compose default)

tags:
  - name: health
  - name: ingest
  - name: projects
  - name: runs
  - name: evals
  - name: benchmarks

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealthz
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadyz
      responses:
        "200":
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ingest:
    post:
      tags: [ingest]
      summary: Ingest a trace batch
      description: |
        Accepts an `IngestBatch` of runs, spans, and/or events.
        Delivery is at-least-once; server MUST upsert by entity IDs.
      operationId: postIngest
      security:
        - ApiKeyAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatch"
            examples:
              hello:
                summary: Hello batch
                externalValue: ../fixtures/valid/ingest-batch.hello.json
      responses:
        "202":
          description: Batch accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestAccepted"
        "400":
          description: Schema validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects:
    get:
      tags: [projects]
      summary: List projects
      operationId: listProjects
      security:
        - ApiKeyAuth: []
        - {}
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      tags: [projects]
      summary: Create project
      operationId: createProject
      security:
        - ApiKeyAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /v1/projects/{project_id}:
    get:
      tags: [projects]
      summary: Get project
      operationId: getProject
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/runs:
    get:
      tags: [runs]
      summary: List runs in a project
      operationId: listRuns
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: status
          in: query
          schema:
            type: string
            enum: [running, succeeded, failed, cancelled, timed_out]
        - name: agent_version
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Run summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"

  /v1/projects/{project_id}/runs/{run_id}:
    get:
      tags: [runs]
      summary: Get run detail (timeline)
      operationId: getRun
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - name: include
          in: query
          description: Comma-separated extras (spans,events,metrics)
          schema:
            type: string
            default: spans,events,metrics
      responses:
        "200":
          description: Run with optional embedded timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/evaluators:
    get:
      tags: [evals]
      summary: List evaluators for a project
      operationId: listEvaluators
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Evaluator list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Evaluator"
    post:
      tags: [evals]
      summary: Register a versioned evaluator (immutable version)
      operationId: createEvaluator
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluatorCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluator"
        "400":
          description: Invalid or duplicate version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/suites:
    get:
      tags: [evals]
      summary: List suites
      operationId: listSuites
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Suite list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Suite"
    post:
      tags: [evals]
      summary: Register a versioned suite
      operationId: createSuite
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuiteCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suite"

  /v1/projects/{project_id}/evals:
    post:
      tags: [evals]
      summary: Evaluate a run with a suite
      description: |
        Executes the suite synchronously against a stored run.
        Creates immutable Score rows. Re-runs create new jobs/scores.
      operationId: createEvalJob
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalJobCreate"
      responses:
        "202":
          description: Eval job finished (succeeded or failed status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalJob"
        "400":
          description: Invalid suite/run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/evals/{job_id}:
    get:
      tags: [evals]
      summary: Get eval job + scores
      operationId: getEvalJob
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eval job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalJob"

  /v1/projects/{project_id}/runs/{run_id}/scores:
    get:
      tags: [evals]
      summary: List immutable scores for a run
      operationId: listRunScores
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Scores
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Score"

  /v1/projects/{project_id}/benchmark-suites:
    get:
      tags: [benchmarks]
      summary: List benchmark suites
      operationId: listBenchmarkSuites
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Benchmark suite list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BenchmarkSuite"
    post:
      tags: [benchmarks]
      summary: Register a versioned benchmark suite
      description: |
        Defines tasks, optional linked eval suite, and sweep dimensions.
        Sentinel does not execute agents; callers register completed runs as cells.
      operationId: createBenchmarkSuite
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkSuiteCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkSuite"

  /v1/projects/{project_id}/benchmark-suites/{benchmark_id}/cells:
    get:
      tags: [benchmarks]
      summary: List benchmark cells
      operationId: listBenchmarkCells
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: benchmark_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Cells
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BenchmarkCell"
    post:
      tags: [benchmarks]
      summary: Register a matrix cell (link a completed run)
      operationId: registerBenchmarkCell
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: benchmark_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, run_id]
              additionalProperties: false
              properties:
                task_id:
                  type: string
                run_id:
                  type: string
                dimensions:
                  type: object
                  additionalProperties: true
                environment:
                  type: object
                  additionalProperties: true
                cell_id:
                  type: string
                eval_job_id:
                  type: string
                run_eval:
                  type: boolean
                benchmark_version:
                  type: string
      responses:
        "201":
          description: Cell registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkCell"

  /v1/projects/{project_id}/benchmark-suites/{benchmark_id}/leaderboard:
    get:
      tags: [benchmarks]
      summary: Matrix leaderboard for a benchmark suite
      operationId: getBenchmarkLeaderboard
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: benchmark_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
        - name: baseline_agent_version
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/projects/{project_id}/benchmarks:
    post:
      tags: [benchmarks]
      summary: Build a benchmark comparison report
      description: |
        Aggregates registered cells into a leaderboard and optional pairwise
        deltas vs baseline_agent_version. Executes synchronously.
      operationId: createBenchmarkJob
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkJobCreate"
      responses:
        "202":
          description: Benchmark job finished (succeeded or failed status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkJob"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/benchmarks/{job_id}:
    get:
      tags: [benchmarks]
      summary: Get benchmark comparison job
      operationId: getBenchmarkJob
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Benchmark job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkJob"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Sentinel-Api-Key
      description: |
        Optional in local single-user mode. Required for non-local profiles in later phases.

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  schemas:
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        version:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Machine-readable code (e.g. SCHEMA_VALIDATION_FAILED)
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    Project:
      type: object
      required: [id, name, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        description:
          type: string

    ProjectCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Optional client-supplied ID
        name:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string

    IngestBatch:
      type: object
      description: |
        Mirror of jsonschema/v1/ingest-batch.schema.json.
        Prefer validating against the JSON Schema files for full fidelity.
      required: [schema_version, project_id]
      additionalProperties: false
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        project_id:
          type: string
        batch_id:
          type: string
        sent_at:
          type: string
          format: date-time
        runs:
          type: array
          items:
            type: object
            additionalProperties: true
        spans:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true

    IngestAccepted:
      type: object
      required: [accepted, project_id]
      additionalProperties: false
      properties:
        accepted:
          type: boolean
          const: true
        project_id:
          type: string
        batch_id:
          type: string
        counts:
          type: object
          additionalProperties: false
          properties:
            runs:
              type: integer
              minimum: 0
            spans:
              type: integer
              minimum: 0
            events:
              type: integer
              minimum: 0

    RunSummary:
      type: object
      required: [run_id, status, started_at]
      additionalProperties: false
      properties:
        run_id:
          type: string
        name:
          type: string
        agent_name:
          type: string
        agent_version:
          type: string
        status:
          type: string
          enum: [running, succeeded, failed, cancelled, timed_out]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string

    RunListResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        next_cursor:
          type: string

    RunDetail:
      type: object
      required: [run]
      additionalProperties: false
      properties:
        run:
          type: object
          additionalProperties: true
          description: Canonical Run object
        spans:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        metrics:
          type: object
          additionalProperties: true
          description: Derived metrics (populated in metrics phase)

    EvalJobCreate:
      type: object
      required: [run_id, suite_id]
      additionalProperties: false
      properties:
        run_id:
          type: string
        suite_id:
          type: string
        suite_version:
          type: string

    EvalJob:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id:
          type: string
        project_id:
          type: string
        suite_id:
          type: string
        suite_version:
          type: string
        run_id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        passed:
          type: boolean
          nullable: true
        summary:
          type: object
          additionalProperties: true
        scores:
          type: array
          items:
            $ref: "#/components/schemas/Score"
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    EvaluatorCreate:
      type: object
      required: [evaluator_id, version, kind, name, config]
      additionalProperties: false
      properties:
        evaluator_id:
          type: string
        version:
          type: string
        kind:
          type: string
          enum: [deterministic, judge]
        name:
          type: string
        description:
          type: string
        config:
          type: object
          additionalProperties: true

    Evaluator:
      type: object
      required: [evaluator_id, version, kind, name, config]
      additionalProperties: false
      properties:
        evaluator_id:
          type: string
        version:
          type: string
        kind:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        config:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    SuiteCreate:
      type: object
      required: [suite_id, version, name, definition]
      additionalProperties: false
      properties:
        suite_id:
          type: string
        version:
          type: string
        name:
          type: string
        description:
          type: string
        definition:
          type: object
          additionalProperties: true

    Suite:
      type: object
      required: [suite_id, version, name, definition]
      additionalProperties: false
      properties:
        suite_id:
          type: string
        version:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        definition:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    Score:
      type: object
      required: [id, run_id, evaluator_id, evaluator_version, passed]
      additionalProperties: false
      properties:
        id:
          type: integer
        project_id:
          type: string
        run_id:
          type: string
        eval_job_id:
          type: string
        evaluator_id:
          type: string
        evaluator_version:
          type: string
        evaluator_kind:
          type: string
        score_value:
          type: number
          nullable: true
        passed:
          type: boolean
        rationale:
          type: string
          nullable: true
        details:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    BenchmarkJobCreate:
      type: object
      additionalProperties: false
      properties:
        suite_id:
          type: string
          description: Alias for benchmark_id (OpenAPI compatibility)
        benchmark_id:
          type: string
        benchmark_version:
          type: string
        baseline_agent_version:
          type: string

    BenchmarkJob:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id:
          type: string
        project_id:
          type: string
        benchmark_id:
          type: string
        benchmark_version:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        baseline_agent_version:
          type: string
          nullable: true
        report:
          type: object
          additionalProperties: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    BenchmarkSuiteCreate:
      type: object
      required: [benchmark_id, version, name, definition]
      additionalProperties: false
      properties:
        benchmark_id:
          type: string
        version:
          type: string
        name:
          type: string
        description:
          type: string
        definition:
          type: object
          additionalProperties: true

    BenchmarkSuite:
      type: object
      required: [benchmark_id, version, name, definition]
      additionalProperties: false
      properties:
        benchmark_id:
          type: string
        version:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        definition:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    BenchmarkCell:
      type: object
      required: [cell_id, task_id, run_id, dimensions, environment_fingerprint]
      additionalProperties: false
      properties:
        cell_id:
          type: string
        benchmark_id:
          type: string
        benchmark_version:
          type: string
        task_id:
          type: string
        run_id:
          type: string
        eval_job_id:
          type: string
          nullable: true
        dimensions:
          type: object
          additionalProperties: true
