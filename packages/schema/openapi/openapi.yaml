openapi: 3.1.0
info:
  title: Sentinel AI API
  description: |
    HTTP contract for Sentinel AI ingest and control plane.

    Trace payloads MUST conform to `packages/schema/jsonschema/v1`.

    **Implementation status:** Ingest, projects, runs, health, quarantine, and
    derived metrics routes are implemented by `apps/server` (Phases 3–4).
    Eval/benchmark routes remain stubs until later phases.
  version: 0.1.0
  contact:
    name: Sentinel AI Maintainers
  license:
    name: License TBD
    url: https://github.com/itsAttaullah/sentinel-ai

servers:
  - url: http://localhost:8080
    description: Local self-hosted (future Compose default)

tags:
  - name: health
  - name: ingest
  - name: projects
  - name: runs
  - name: evals
  - name: benchmarks

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealthz
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadyz
      responses:
        "200":
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ingest:
    post:
      tags: [ingest]
      summary: Ingest a trace batch
      description: |
        Accepts an `IngestBatch` of runs, spans, and/or events.
        Delivery is at-least-once; server MUST upsert by entity IDs.
      operationId: postIngest
      security:
        - ApiKeyAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatch"
            examples:
              hello:
                summary: Hello batch
                externalValue: ../fixtures/valid/ingest-batch.hello.json
      responses:
        "202":
          description: Batch accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestAccepted"
        "400":
          description: Schema validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects:
    get:
      tags: [projects]
      summary: List projects
      operationId: listProjects
      security:
        - ApiKeyAuth: []
        - {}
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
    post:
      tags: [projects]
      summary: Create project
      operationId: createProject
      security:
        - ApiKeyAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /v1/projects/{project_id}:
    get:
      tags: [projects]
      summary: Get project
      operationId: getProject
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/runs:
    get:
      tags: [runs]
      summary: List runs in a project
      operationId: listRuns
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: status
          in: query
          schema:
            type: string
            enum: [running, succeeded, failed, cancelled, timed_out]
        - name: agent_version
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Run summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"

  /v1/projects/{project_id}/runs/{run_id}:
    get:
      tags: [runs]
      summary: Get run detail (timeline)
      operationId: getRun
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - name: include
          in: query
          description: Comma-separated extras (spans,events,metrics)
          schema:
            type: string
            default: spans,events,metrics
      responses:
        "200":
          description: Run with optional embedded timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/evals:
    post:
      tags: [evals]
      summary: Trigger evaluation for a run (stub)
      description: Implemented in evaluation phase. Declared early for contract stability.
      operationId: createEvalJob
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalJobCreate"
      responses:
        "202":
          description: Eval job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalJob"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/projects/{project_id}/benchmarks:
    post:
      tags: [benchmarks]
      summary: Register or trigger a benchmark comparison (stub)
      description: Implemented in benchmarking phase. Declared early for contract stability.
      operationId: createBenchmarkJob
      security:
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkJobCreate"
      responses:
        "202":
          description: Benchmark job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkJob"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Sentinel-Api-Key
      description: |
        Optional in local single-user mode. Required for non-local profiles in later phases.

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  schemas:
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        version:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Machine-readable code (e.g. SCHEMA_VALIDATION_FAILED)
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    Project:
      type: object
      required: [id, name, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        description:
          type: string

    ProjectCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Optional client-supplied ID
        name:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string

    IngestBatch:
      type: object
      description: |
        Mirror of jsonschema/v1/ingest-batch.schema.json.
        Prefer validating against the JSON Schema files for full fidelity.
      required: [schema_version, project_id]
      additionalProperties: false
      properties:
        schema_version:
          type: string
          const: "1.0.0"
        project_id:
          type: string
        batch_id:
          type: string
        sent_at:
          type: string
          format: date-time
        runs:
          type: array
          items:
            type: object
            additionalProperties: true
        spans:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true

    IngestAccepted:
      type: object
      required: [accepted, project_id]
      additionalProperties: false
      properties:
        accepted:
          type: boolean
          const: true
        project_id:
          type: string
        batch_id:
          type: string
        counts:
          type: object
          additionalProperties: false
          properties:
            runs:
              type: integer
              minimum: 0
            spans:
              type: integer
              minimum: 0
            events:
              type: integer
              minimum: 0

    RunSummary:
      type: object
      required: [run_id, status, started_at]
      additionalProperties: false
      properties:
        run_id:
          type: string
        name:
          type: string
        agent_name:
          type: string
        agent_version:
          type: string
        status:
          type: string
          enum: [running, succeeded, failed, cancelled, timed_out]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string

    RunListResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        next_cursor:
          type: string

    RunDetail:
      type: object
      required: [run]
      additionalProperties: false
      properties:
        run:
          type: object
          additionalProperties: true
          description: Canonical Run object
        spans:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        metrics:
          type: object
          additionalProperties: true
          description: Derived metrics (populated in metrics phase)

    EvalJobCreate:
      type: object
      required: [run_id, suite_id]
      additionalProperties: false
      properties:
        run_id:
          type: string
        suite_id:
          type: string

    EvalJob:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]

    BenchmarkJobCreate:
      type: object
      required: [suite_id]
      additionalProperties: false
      properties:
        suite_id:
          type: string
        baseline_agent_version:
          type: string

    BenchmarkJob:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed]
