[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinel-cli"
version = "0.1.0"
description = "Sentinel AI developer CLI for init, upload, and query workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License TBD" }
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
sentinel = "sentinel_cli.app:main"

[tool.hatch.build.targets.sdist]
include = [
  "src/sentinel_cli",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
